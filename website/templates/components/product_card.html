{% load price_filters %}
<div class="relative bg-white rounded-2xl shadow-2xl overflow-hidden transition-all duration-500">
    <div class="relative overflow-hidden h-80">
      <img src="{{ src }}" alt="{{ alt }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
      <!-- Badge de subasta -->
      <div class="absolute top-5 right-5 bg-gradient-to-r from-amber-500 to-amber-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg">
        SUBASTA ACTIVA
      </div>
      <!-- Contador regresivo -->
      <div class="absolute inline-flex items-center bottom-5 left-5 bg-black text-white text-xs font-medium px-3 py-1 rounded-full mr-10">
        <svg class="h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ end_time }}
      </div>
    </div>
    <!-- Detalles producto -->
    <div class="p-6">
      <div class="flex justify-between items-start mb-2">
        <h4 class="text-xl font-semibold text-gray-900 group-hover:text-amber-600 transition">{{ name }}</h4>
        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">{{ category }}</span>
      </div>
      <p class="text-sm text-gray-500 mb-4">{{ description }}</p>
      <div class="flex justify-between items-center">
        <div class="flex flex-col">
          <p class="text-xs text-gray-400">Puja actual</p>
          <p class="text-2xl font-bold text-gray-900">{{ actual_price|clean_price }}€</p>
        </div>
        <a href="{{ product_link }}" class="bg-gray-900 hover:bg-amber-600 text-white text-sm font-medium px-6 py-3 rounded-full transition-all flex items-center">Pujar</a>
      </div>
    </div>
</div>
