{% if stores %}
<div class="overflow-x-auto">
  <div class="text-right">
      <a href="" id="open-form" class="inline-block mb-5 text-amber-600 hover:text-amber-700 font-medium">Invitar usuario</a>
  </div>
  <table class="min-w-full table-auto bg-white border border-gray-200 rounded-lg">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="py-3 px-6 text-left">Nombre</th>
      </tr>
    </thead>
    <tbody>
      {% for store in stores %}
        <tr class="border-t border-gray-200">
          <td class="py-2 px-6">{{ store.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<div class="flex justify-center items-center gap-6 mt-3">
    <!-- Botón página anterior -->
    <a id="previous-page-stores" href="#profile-stores" class="inline-flex items-center text-amber-600 font-medium hover:underline">
        ← Página anterior
    </a>
    <span id="current-page-stores" class="text-gray-700 font-semibold">Página 1</span>
    <!-- Botón siguiente página -->
    <a id="next-page-stores" href="#profile-stores" class="inline-flex items-center text-amber-600 font-medium hover:underline">
        Siguiente página →
    </a>
</div>
{% else %}
    <p class="text-gray-500 text-center py-4">No tienes tiendas registradas</p>
{% endif %}

<!-- Modal oculto -->
<div id="form-modal" style="display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000;">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 pb-2 border-b border-gray-200">Invitar usuario</h2>
    <form class="space-y-5">
        <div>
            <select name="store" id="store-select" class="block w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none focus:border-transparent">
                <option value="">Seleccionar tienda</option>
                {% for store in stores %}
                    <option value="{{ store.id }}">{{ store.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <input type="text" name="username" placeholder="Nombre de usuario"
            class="block w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 appearance-none focus:ring-amber-500 focus:outline-none focus:border-transparent">
        </div>
        <div class="container mx-auto flex p-5 space-x-4">
            <button type="submit" 
                class="bg-gray-900 hover:bg-amber-600 text-white py-3 px-6 rounded-lg transition-colors duration-300 w-full sm:w-auto">
                Invitar
            </button>
            <button type="button" id="close-form" 
                class="bg-gray-900 hover:bg-amber-600 text-white py-3 px-6 rounded-lg transition-colors duration-300 w-full sm:w-auto">
                Cancelar
            </button>
        </div>
    </form>
</div>

<!-- Fondo oscurecido -->
<div id="overlay" style="display: none; position: fixed; top: 0; left: 0; 
    width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999;"></div>

<script>    
  document.getElementById('open-form').addEventListener('click', function(event) {
    event.preventDefault();
    document.getElementById('form-modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
  });

  document.getElementById('close-form').addEventListener('click', function() {
      document.getElementById('form-modal').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
  });
</script>
