{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="flex-1 flex flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24">
      <div class="w-full max-w-sm mx-auto">
        <div>
          <h2 class="mt-6 text-3xl font-extrabold leading-9 text-gray-900">
            Login to your account
          </h2>
        </div>
        <div class="mt-8">
          <div class="mt-6">
            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="mt-1">
                        <input class="block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 appearance-none focus:outline-none focus:border-blue-300 transition duration-150 ease-in-out sm:text-sm sm:leading-5" type="text" id="username" name="username" required>
                    </div>
                </div>
                <div class="form-group mt-6">
                    <label for="username">Password</label>
                    <div class="mt-1">
                        <input class="block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 appearance-none focus:outline-none focus:border-blue-300 transition duration-150 ease-in-out sm:text-sm sm:leading-5" type="password" id="password" name="password" required>
                    </div>
                </div>
                {% if form.errors %}
                    <div class="error-message">
                        Invalid username or password.
                    </div>
                {% endif %}
                <div class="mt-6">
                    <span class="block w-full rounded-md">
                        <button type="submit" class="flex justify-center w-full px-4 py-2 text-sm font-medium text-white border border-transparent bg-gray-900 hover:bg-amber-600 focus:outline-none transition duration-150 ease-in-out">
                        Login
                        </button>
                    </span>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
